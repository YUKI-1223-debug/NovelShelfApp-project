# ミニPC本番オーバーレイ。開発用 docker-compose.yml に重ねて使う。
# 使用例（プロジェクトルートではなく docker/ ディレクトリで）:
#   cd docker
#   docker compose --env-file ../.env -f docker-compose.yml -f docker-compose.minipc.yml up -d --build
#
# VPS 用の docker-compose.prod.yml との違い:
#   - nginx / certbot を含まない（TLS 終端は Cloudflare エッジ。リバースプロキシは /srv/edge の共有 Caddy）
#   - frontend / backend を Docker 外部ネットワーク "edge" にエイリアス付きで参加させ、共有 Caddy から
#     novelshelf-backend:8080 / novelshelf-frontend:3000 で到達できるようにする
#   - postgres はホストにポートを出さない。backend は 127.0.0.1:8020 だけに出す（tailscale serve :8445 用、2026-10〜）
#
# 前提: 事前に `docker network create edge` 済み（/srv/edge のスタックが作成する）。
# 移設手順は docs/MIGRATION_to_minipc.md、ミニPC全体は WorkSpace/ミニPC-Linux移行手順.md を参照。
#
# 注意: `ports: !reset []` は Docker Compose 2.24 以降が必要。
#       各サービスの `networks:` で `default` を必ず明示すること（省くと backend が postgres に繋がらない）。

services:
  postgres:
    restart: unless-stopped
    ports: !reset []          # ホストにもLANにも公開しない

  backend:
    restart: unless-stopped
    # 127.0.0.1:8020 だけで待ち受け、`tailscale serve --https=8445` で tailnet 内にだけ出す(個人利用アプリ化 S2-1)。
    # novelshelf.jp を閉じるまでは、共有 Caddy(edge ネットワーク)からの経路も残す
    ports: !override
      - "127.0.0.1:8020:8080"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      # オーナー固定モード: tailnet 由来でトークンの無いリクエストを OWNER_USER_ID として扱う(ログイン画面の廃止)
      OWNER_MODE_ENABLED: ${OWNER_MODE_ENABLED:-false}
      OWNER_USER_ID: ${OWNER_USER_ID:-}
      TAILNET_CIDRS: 100.64.0.0/10,fd7a:115c:a1e0::/48
      # Web 版のオリジンに加えて、Windows(Tauri)の http://tauri.localhost を許可する。Tauri の plugin-http は
      # Origin ヘッダを付けて送るので、許可しないと 403 になる(JavaSilver で 2026-10-18 に発生)。
      # iOS/Android は CapacitorHttp が Origin を付けないので不要だが、念のため入れておく。
      # chrome-extension://noknmckhajflpgeidknhdadldnfiedin はブラウザ拡張(manifest の key で ID を固定)。
      # 注意: オーナー固定モードは「tailnet から来た」だけで認証するので、PC のブラウザで開いた別のサイトから
      # tailnet の URL を叩かれる経路がある。Spring は許可していないオリジンのリクエストを 403 で止めるので、
      # ここを "*" やワイルドカードにしないこと
      CORS_ALLOWED_ORIGINS: https://${DOMAIN},capacitor://localhost,https://localhost,http://tauri.localhost,chrome-extension://noknmckhajflpgeidknhdadldnfiedin
      # メモリの潤沢な機体だが、現行VPS(2GB)と挙動を揃えるためJVMヒープ上限は据え置き
      JAVA_TOOL_OPTIONS: "-Xmx768m"
      # パスワード再設定メールのリンク生成に使う。本番ドメインから自動導出する
      FRONTEND_BASE_URL: https://${DOMAIN}
      # プッシュ通知(FCM)。下の secrets ディレクトリマウントに合わせた固定パス。
      # ファイルが無ければバックエンドは「未設定」として扱い、送信せずログのみ（起動はできる）。
      FIREBASE_CREDENTIALS: /run/secrets/firebase-service-account.json
    volumes:
      # ミニPCの /srv/NovelShelfApp-project/secrets/ を read-only でマウント。
      # 事前に `mkdir -p secrets` し、Firebase のサービスアカウント JSON を
      # secrets/firebase-service-account.json として置く（docs/FIREBASE_SETUP.md）。
      - ../secrets:/run/secrets:ro
    networks:
      default: {}
      edge:
        aliases:
          - novelshelf-backend

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}/api/v1
    restart: unless-stopped
    ports: !reset []          # 共有 Caddy 経由でのみ到達可能
    networks:
      default: {}
      edge:
        aliases:
          - novelshelf-frontend

networks:
  edge:
    external: true
