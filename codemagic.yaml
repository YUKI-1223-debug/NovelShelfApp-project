# Codemagic: iOS アプリ（Capacitor）をクラウド Mac でビルドして TestFlight へ配布する。
# 前提（Codemagic UI 側の設定。詳細は docs/IOS_SETUP.md）:
#   - App Store Connect API キーを Team integration として登録（名前: "novelshelf-appstore"）
#   - 署名は Codemagic の自動コード署名（environment.ios_signing）が
#     証明書とプロファイルをビルド前に keychain / Provisioning Profiles へ配置する。
#     （手動 fetch-signing-files --create は Apple から秘密鍵を取得できず失敗するため不可。
#      証明書と App Store プロファイルの初回作成手順は docs/IOS_SETUP.md ステップ5）
#   - ただし ExportOptions.plist は自動生成されないので、build-ipa の前に
#     `xcode-project use-profiles` を明示実行して /Users/builder/export_options.plist を作る。
#   - プッシュ通知（フェーズC）: App ID に Push Notifications capability を付け、App Store
#     プロビジョニングプロファイルを作り直しておくこと。Firebase の iOS 設定ファイルは
#     secure 環境変数 GOOGLE_SERVICE_INFO_PLIST_B64（group: firebase / base64）から
#     ビルド時に frontend/ios/App/App/GoogleService-Info.plist へ展開する（下記ステップ）。
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: novelshelf-appstore
    environment:
      groups:
        - firebase
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.novelshelf.app
      vars:
        APP_STORE_APP_ID: "6809167553"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: npm install
        script: cd frontend && npm ci
      - name: GoogleService-Info.plist を復元
        script: |
          set -e
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_B64" ]; then
            echo "GOOGLE_SERVICE_INFO_PLIST_B64 が未設定です（Codemagic の環境変数 group: firebase）。" >&2
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > frontend/ios/App/App/GoogleService-Info.plist
          /usr/libexec/PlistBuddy -c "Print :BUNDLE_ID" frontend/ios/App/App/GoogleService-Info.plist
      - name: Web ビルド（静的エクスポート）
        script: cd frontend && npm run build:app
      - name: Capacitor sync（iOS へ web アセット反映）
        script: cd frontend && npx cap sync ios
      - name: 署名設定を Xcode プロジェクトへ適用
        # ios_signing が配置した証明書・プロファイルを App.xcodeproj に反映し、
        # build-ipa が既定で参照する /Users/builder/export_options.plist を生成する。
        # （cap sync がプロジェクトを再生成しうるので必ずその後に実行）
        script: xcode-project use-profiles
      - name: ビルド番号のインクリメント
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          cd frontend/ios/App
          agvtool new-version -all $((LATEST + 1))
      - name: IPA ビルド
        script: |
          cd frontend/ios/App
          xcode-project build-ipa --project "App.xcodeproj" --scheme "$XCODE_SCHEME"
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # TestFlight へアップロード + Apple の処理完了まで待つ。内部テスト
        # （App Store Connect のユーザーを追加した Internal Testing グループ）は
        # 処理完了後に自動で配信されるため、これ以上の指定は不要。
        #
        # submit_to_testflight は付けない: 付けると「外部テストのベータ審査へ提出」
        # までやろうとし、Beta App Information（フィードバックEmail）と Beta App Review
        # Information（氏名・電話・Email）が未入力だと post-processing が失敗する
        # （2026-09-07 に発生）。内部テストしかしないので外部審査は不要。
        # 外部テストを始めるときは App Store Connect の test-info を埋めてから
        # submit_to_testflight: true + beta_groups を追加する。
