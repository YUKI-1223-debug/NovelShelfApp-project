# Codemagic: iOS アプリ（Capacitor）をクラウド Mac でビルドして TestFlight へ配布する。
# 前提（Codemagic UI 側の設定。詳細は docs/IOS_SETUP.md）:
#   - App Store Connect API キーを Team integration として登録（名前: "novelshelf-appstore"）
#   - 署名は Codemagic の自動コード署名（environment.ios_signing）に委任。
#     Codemagic が証明書の秘密鍵を生成・チームに保存し、証明書/プロファイルの
#     取得・作成・use-profiles までビルド前に自動実行する。
#     （手動 fetch-signing-files --create は Apple から秘密鍵を取得できず失敗するため不可）
workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: novelshelf-appstore
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.novelshelf.app
      vars:
        APP_STORE_APP_ID: "6809167553"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: npm install
        script: cd frontend && npm ci
      - name: Web ビルド（静的エクスポート）
        script: cd frontend && npm run build:app
      - name: Capacitor sync（iOS へ web アセット反映）
        script: cd frontend && npx cap sync ios
      - name: ビルド番号のインクリメント
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          cd frontend/ios/App
          agvtool new-version -all $((LATEST + 1))
      - name: IPA ビルド
        script: |
          cd frontend/ios/App
          xcode-project build-ipa --project "App.xcodeproj" --scheme "$XCODE_SCHEME"
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "自分用"
