<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>NovelShelf</title>
    <style>
      body {
        width: 260px;
        padding: 16px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
        font-size: 13px;
        color: #221f1b;
        background: #f0ece2;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      button {
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #2b3a55;
        color: #f7f4ec;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
      }
      #status {
        margin: 0 0 8px;
        font-size: 12px;
        min-height: 1em;
        line-height: 1.5;
        color: #4a463f;
      }
      #status.ok {
        color: #2b3a55;
      }
      #status.error {
        color: #a13d2b;
      }
    </style>
  </head>
  <body>
    <h1>NovelShelf</h1>
    <p id="status"></p>
    <button id="retryBtn" style="display: none">再確認</button>
    <script src="popup.js"></script>
  </body>
</html>
