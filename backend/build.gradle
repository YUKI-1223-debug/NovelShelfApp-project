plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.novelshelf'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('jjwtVersion', '0.13.0')
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	runtimeOnly 'org.postgresql:postgresql'

	implementation 'io.jsonwebtoken:jjwt-api:' + jjwtVersion
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:' + jjwtVersion
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:' + jjwtVersion

	implementation 'org.jsoup:jsoup:1.22.2'

	// プッシュ通知: FCM HTTP v1 API を直接呼ぶ。firebase-admin SDK は grpc/netty 等で重く
	// google-http-client の GZIP 処理バグにも当たるため使わない。必要なのはトークン発行だけ。
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.33.1'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-restclient'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'external'
	}
}

tasks.register('externalTest', Test) {
	description = 'なろう実サイトへの疎通を伴うテストのみ実行する（手動実行用、通常のtestタスクからは除外）'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'external'
	}
	// R18疎通テスト用の実ID指定を、ビルドJVMからテストのフォークJVMへ転送する（未指定時はnullのまま渡し、該当テストはスキップされる）
	if (System.getProperty('narouR18Ncode') != null) {
		systemProperty 'narouR18Ncode', System.getProperty('narouR18Ncode')
	}
	if (System.getProperty('hamelnR18NovelId') != null) {
		systemProperty 'hamelnR18NovelId', System.getProperty('hamelnR18NovelId')
	}
	// Firebase サービスアカウントの疎通確認（FirebaseCredentialsLiveTest）用。未指定なら該当テストはスキップ。
	if (System.getProperty('firebaseCredentials') != null) {
		systemProperty 'firebaseCredentials', System.getProperty('firebaseCredentials')
	}
	if (System.getProperty('fcmToken') != null) {
		systemProperty 'fcmToken', System.getProperty('fcmToken')
	}
}
